# Build the Quarkus native binary on an ARM runner and deploy to EC2 via SSM Run Command.
#
# The `native-release-pgo` profile builds THREE native binaries (normal / instrumented / optimized),
# runs a 10-worker × 5-minute load workload against each, prints a side-by-side comparison, and
# copies the better of normal-vs-optimized to target/oppshan-files-*-runner. Single Maven reactor,
# no nested mvn; the lifecycle interleaves quarkus:build executions with exec-maven-plugin
# executions across prepare-package → package → pre-integration-test → integration-test phases:
#   prepare-package        docker compose up + keycloak-bootstrap + build NORMAL
#   package                save NORMAL + load-test NORMAL + reset DB + build INSTRUMENTED
#   pre-integration-test   save INSTRUMENTED + load-test INSTRUMENTED + reset DB + build OPTIMIZED
#   integration-test       save OPTIMIZED + load-test OPTIMIZED + compare + pick winner
#   post-integration-test  docker compose down -v
# Between load tests the app tables are truncated (container stays up) so each
# binary sees an empty-app starting state while Postgres page cache stays warm.
# The instrumented binary is throwaway (its only role is to produce the iprof that feeds the
# optimized build) and is deleted by the select-winner step. The artifact that ships to prod is
# whichever of normal/optimized had more total iterations in its load test.
# Docker + Compose are pre-installed on GitHub-hosted ubuntu-24.04-arm runners; no extra setup.
#
# No SSH, no long-lived AWS keys — OIDC federation lets this workflow assume an IAM role
# at runtime, scoped via the role's trust policy to this repo + main branch only.

name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    timeout-minutes: 120

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw -B test

      - name: Build + load-test + select native binary
        # `verify` walks the whole comparison lifecycle (prepare-package → package
        # → pre-integration-test → integration-test → post-integration-test → verify):
        # three native builds, three load tests, comparison table, winner copied to
        # target/...-runner. Tests already ran in the prior step, so -DskipTests
        # prevents surefire from re-executing them.
        run: ./mvnw -B -Pnative-release-pgo verify -DskipTests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          ARTIFACT_KEY="releases/$(git rev-parse --short HEAD).runner"
          aws s3 cp target/oppshan-files-*-runner "s3://${{ secrets.AWS_ARTIFACT_BUCKET }}/${ARTIFACT_KEY}"
          echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> "$GITHUB_ENV"

      - name: Deploy via SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"sudo systemctl stop oppshan-files || true\",
              \"sudo aws s3 cp s3://${{ secrets.AWS_ARTIFACT_BUCKET }}/${ARTIFACT_KEY} /opt/oppshan-files/oppshan-files-runner\",
              \"sudo chmod +x /opt/oppshan-files/oppshan-files-runner\",
              \"sudo chown oppshan:oppshan /opt/oppshan-files/oppshan-files-runner\",
              \"sudo systemctl start oppshan-files\"
            ]" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}"