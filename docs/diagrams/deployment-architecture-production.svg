    <text x="122" y="715" text-anchor="middle" font-size="9" fill="#717D7E">DB creds · encryption key</text>
    <text x="122" y="728" text-anchor="middle" font-size="9" fill="#717D7E">OIDC secrets · auto-rotate</text>

    <rect x="218" y="686" width="140" height="52" rx="6" fill="#FDFEFE" stroke="#AAB7B8" stroke-width="1"/>
    <text x="288" y="702" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">CloudWatch</text>
    <text x="288" y="715" text-anchor="middle" font-size="9" fill="#717D7E">metrics · logs · alarms</text>
    <text x="288" y="728" text-anchor="middle" font-size="9" fill="#717D7E">ASG scaling triggers</text>

    <rect x="370" y="686" width="140" height="52" rx="6" fill="#FDFEFE" stroke="#AAB7B8" stroke-width="1"/>
    <text x="440" y="702" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">S3</text>
    <text x="440" y="715" text-anchor="middle" font-size="9" fill="#717D7E">artifacts · static assets</text>
    <text x="440" y="728" text-anchor="middle" font-size="9" fill="#717D7E">encrypted file content</text>

    <rect x="522" y="686" width="140" height="52" rx="6" fill="#FDFEFE" stroke="#AAB7B8" stroke-width="1"/>
    <text x="592" y="702" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">ACM</text>
    <text x="592" y="715" text-anchor="middle" font-size="9" fill="#717D7E">managed TLS cert</text>
    <text x="592" y="728" text-anchor="middle" font-size="9" fill="#717D7E">auto-renew</text>

    <!-- ── GitHub Actions (outside VPC) ───────────────────────── -->
    <rect x="330" y="768" width="160" height="40" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="410" y="785" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">GitHub Actions</text>
    <text x="410" y="798" text-anchor="middle" font-size="9" fill="#717D7E">OIDC → AWS STS · ARM64 build</text>

    <!-- ══════════════════════════════════════════════════════════
         ARROWS
         ══════════════════════════════════════════════════════════ -->
    <!-- CloudFront → ALB -->
    <line x1="455" y1="64" x2="410" y2="164" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="462" y="118" font-size="9" fill="#546E7A">HTTPS</text>

    <!-- ALB → Quarkus AZ 1a -->
    <line x1="208" y1="188" x2="208" y2="304" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- ALB → Quarkus AZ 1b -->
    <line x1="600" y1="188" x2="600" y2="304" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="616" y="252" font-size="9" fill="#546E7A">round-robin</text>

    <!-- Quarkus AZ 1a → RDS Proxy -->
    <line x1="208" y1="434" x2="208" y2="470" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
