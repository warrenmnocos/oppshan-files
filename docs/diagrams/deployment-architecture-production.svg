    </text>

    <!-- ── AZ labels ───────────────────────────────────────────── -->
    <text x="185" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#5DADE2">AZ 1a</text>
    <text x="605" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#5DADE2">AZ 1b</text>
    <line x1="395" y1="108" x2="395" y2="740" stroke="#B3D4E8" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- ══════════════════════════════════════════════════════════
         PUBLIC SUBNETS  (y=126 → y=228)
         ══════════════════════════════════════════════════════════ -->
    <rect x="22" y="126" width="776" height="102" rx="8" fill="#D6EAF8" stroke="#2980B9" stroke-width="1"/>
    <text x="38" y="141" font-size="9" font-weight="700" fill="#2980B9" letter-spacing="0.3">PUBLIC SUBNETS</text>

