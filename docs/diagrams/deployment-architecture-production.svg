    <text x="118" y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#7D6608">NAT Gateway · AZ 1a</text>

    <rect x="412" y="200" width="160" height="22" rx="6" fill="#FCF3CF" stroke="#B7950B" stroke-width="1.2"/>
    <text x="492" y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#7D6608">NAT Gateway · AZ 1b</text>

    <text x="685" y="215" text-anchor="middle" font-size="9" fill="#7D6608">outbound for private subnets</text>

    <!-- ══════════════════════════════════════════════════════════
