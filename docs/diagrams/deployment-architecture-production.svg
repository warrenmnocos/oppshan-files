    <!-- Quarkus AZ 1b → RDS Proxy -->
    <line x1="600" y1="434" x2="600" y2="470" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- RDS Proxy → Aurora Writer -->
    <line x1="151" y1="502" x2="151" y2="554" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="156" y="530" font-size="9" fill="#546E7A">pooled</text>

    <!-- Quarkus ↔ Google OIDC -->
    <path d="M 700 260 Q 718 160 696 64" stroke="#546E7A" stroke-width="1.5" fill="none"
          marker-end="url(#arr)" marker-start="url(#arr-b)"/>
    <text x="726" y="168" font-size="9" fill="#546E7A">OAuth 2.0</text>

    <!-- GitHub Actions → S3 -->
    <line x1="410" y1="768" x2="440" y2="738" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="436" y="760" font-size="9" fill="#546E7A">upload</text>
