    <line x1="391" y1="604" x2="391" y2="612" stroke="#7D3C98" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="649" y1="604" x2="649" y2="612" stroke="#7D3C98" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- ══════════════════════════════════════════════════════════
