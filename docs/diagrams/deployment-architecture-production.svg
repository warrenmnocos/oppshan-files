    <text x="696" y="54" text-anchor="middle" font-size="10" fill="#757575">OIDC Provider</text>

    <!-- Arrows outside -->
    <line x1="120" y1="41" x2="160" y2="41" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="300" y1="41" x2="352" y2="41" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- ── VPC boundary ─────────────────────────────────────────── -->
    <rect x="10" y="86" width="800" height="668" rx="12"
