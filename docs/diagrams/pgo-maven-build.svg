<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" width="900" height="1320"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
        <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#C0392B"/>
        </marker>
    </defs>

    <rect width="900" height="1320" fill="#FAFAFA"/>

    <!-- Title -->
    <text x="450" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#212121">Maven build flow inside
        PGO orchestration
    </text>
    <text x="450" y="40" text-anchor="middle" font-size="9" fill="#90A4AE">What happens inside `./mvnw -Ppgo exec:exec`
        — outer dispatch, bash bridge, inner native builds, fallback
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         LAYER 1 — Entry command
         ═══════════════════════════════════════════════════════════ -->
    <text x="36" y="68" font-size="9" fill="#546E7A" font-weight="600">Layer 1 · Entry command (user-facing)</text>

    <rect x="200" y="74" width="500" height="50" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="450" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#0E6655">./mvnw -Ppgo exec:exec
    </text>
    <text x="450" y="108" text-anchor="middle" font-size="9" fill="#1ABC9C">single command · same in local and CI ·
        activates the `pgo` Maven profile
    </text>

    <line x1="450" y1="124" x2="450" y2="148" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- ═══════════════════════════════════════════════════════════
         LAYER 2 — Outer Maven · dispatcher
         ═══════════════════════════════════════════════════════════ -->
    <text x="36" y="148" font-size="9" fill="#546E7A" font-weight="600">Layer 2 · Outer Maven · dispatcher (pom.xml
        profile)
    </text>

    <rect x="60" y="154" width="780" height="100" rx="10"
          fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="450" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">Profile &lt;pgo&gt; in
        pom.xml
    </text>

    <rect x="80" y="184" width="350" height="60" rx="6" fill="#FFF8E1" stroke="#E67E22" stroke-width="1"/>
    <text x="255" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#784212">
        org.codehaus.mojo:exec-maven-plugin
    </text>
    <text x="255" y="216" text-anchor="middle" font-size="9" fill="#A04000">goal: exec</text>
    <text x="255" y="230" text-anchor="middle" font-size="9" fill="#A04000">executable: bash · argument:
        graalvm-pgo/local.sh
    </text>

    <rect x="470" y="184" width="350" height="60" rx="6" fill="#FFF8E1" stroke="#E67E22" stroke-width="1"/>
    <text x="645" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#784212">No native-image work
        here
    </text>
    <text x="645" y="216" text-anchor="middle" font-size="9" fill="#A04000">Outer Maven only dispatches to bash;</text>
    <text x="645" y="230" text-anchor="middle" font-size="9" fill="#A04000">no compile, no package, no native build.
    </text>

    <line x1="450" y1="254" x2="450" y2="278" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- ═══════════════════════════════════════════════════════════
         LAYER 3 — Bash orchestrator
         ═══════════════════════════════════════════════════════════ -->
    <text x="36" y="278" font-size="9" fill="#546E7A" font-weight="600">Layer 3 · Bash orchestrator
        (scripts/graalvm-pgo/local.sh)
    </text>

    <rect x="60" y="284" width="780" height="520" rx="10"
          fill="none" stroke="#7D3C98" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="76" y="300" font-size="9" fill="#7D3C98">bash scripts/graalvm-pgo/local.sh (PGO_DOCKER_MANAGED=internal |
        external)
    </text>

    <!-- Step A -->
    <rect x="80" y="310" width="740" height="44" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="450" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">A. Setup (conditional on
        PGO_DOCKER_MANAGED=internal)
    </text>
    <text x="450" y="342" text-anchor="middle" font-size="9" fill="#2980B9">docker compose up · readiness wait ·
        keycloak-bootstrap.sh
    </text>

    <line x1="450" y1="354" x2="450" y2="370" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step B: Inner Maven #1 -->
    <rect x="80" y="372" width="740" height="92" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
    <text x="450" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">B. Inner Maven #1 —
        instrumented native build
    </text>
    <text x="450" y="408" text-anchor="middle" font-size="10" fill="#A04000" font-family="monospace">./mvnw -B
        -Pnative-pgo-instrument package -DskipTests
    </text>
    <text x="450" y="426" text-anchor="middle" font-size="9" fill="#A04000">lifecycle: validate → generate-resources →
        compile → package
    </text>
    <text x="450" y="440" text-anchor="middle" font-size="9" fill="#A04000">quarkus-maven-plugin:build at `package` ·
        native-image with `--pgo-instrument`
    </text>
    <text x="450" y="454" text-anchor="middle" font-size="9" fill="#A04000">→ target/oppshan-files-*-runner
        (instrumented, ~500 MB)
    </text>

    <line x1="450" y1="464" x2="450" y2="480" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step C -->
    <rect x="80" y="482" width="740" height="44" rx="6" fill="#F4ECF7" stroke="#7D3C98" stroke-width="1.5"/>
    <text x="450" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#512E5F">C. Profile collection
    </text>
    <text x="450" y="514" text-anchor="middle" font-size="9" fill="#7D3C98">launch binary · run workload.sh (60s) ·
        SIGTERM · test -s default.iprof
    </text>

    <line x1="450" y1="526" x2="450" y2="542" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step D: Inner Maven #2 -->
    <rect x="80" y="544" width="740" height="92" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="2"/>
    <text x="450" y="564" text-anchor="middle" font-size="12" font-weight="700" fill="#145A32">D. Inner Maven #2 —
        optimized native build
    </text>
    <text x="450" y="580" text-anchor="middle" font-size="10" fill="#27AE60" font-family="monospace">./mvnw -B
        -Pnative-release-pgo package -DskipTests -Dpgo.profile.path=…
    </text>
    <text x="450" y="598" text-anchor="middle" font-size="9" fill="#27AE60">lifecycle: validate → generate-resources →
        compile → package
    </text>
    <text x="450" y="612" text-anchor="middle" font-size="9" fill="#27AE60">quarkus-maven-plugin:build at `package` ·
        native-image with `--pgo=…default.iprof`
    </text>
    <text x="450" y="626" text-anchor="middle" font-size="9" fill="#27AE60">→ target/oppshan-files-*-runner (optimized,
        ~80 MB — overwrites instrumented)
    </text>

    <line x1="450" y1="636" x2="450" y2="652" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step E -->
    <rect x="80" y="654" width="740" height="44" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <text x="450" y="672" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">E. Cleanup (via trap)
    </text>
    <text x="450" y="686" text-anchor="middle" font-size="9" fill="#546E7A">if internal: docker compose down -v ·
        always: kill orphaned binary if alive
    </text>

    <line x1="450" y1="698" x2="450" y2="714" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Fallback branch label -->
    <text x="80" y="720" font-size="9" fill="#C0392B" font-weight="600">Fallback (if Step B/C/D fails — bash `if !
        pgo_pipeline; then …`)
    </text>

    <!-- Fallback -->
    <rect x="80" y="726" width="740" height="68" rx="6" fill="#FADBD8" stroke="#C0392B" stroke-width="2"
          stroke-dasharray="6 4"/>
    <text x="450" y="744" text-anchor="middle" font-size="11" font-weight="700" fill="#641E16">F. Inner Maven #fallback
        — non-PGO native build
    </text>
    <text x="450" y="760" text-anchor="middle" font-size="10" fill="#C0392B" font-family="monospace">./mvnw -B
        -Pnative-release package -DskipTests
    </text>
    <text x="450" y="776" text-anchor="middle" font-size="9" fill="#C0392B">quarkus-maven-plugin:build at `package` ·
        native-image (no PGO flag)
    </text>
    <text x="450" y="790" text-anchor="middle" font-size="9" fill="#C0392B">→ target/oppshan-files-*-runner (non-PGO
        release) · script exits 0 so deploy continues
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         LAYER 4 — What happens at the `package` phase (inner Maven detail)
         ═══════════════════════════════════════════════════════════ -->
    <text x="36" y="828" font-size="9" fill="#546E7A" font-weight="600">Layer 4 · Inner Maven lifecycle detail (same
        shape for all three native builds)
    </text>

    <rect x="60" y="834" width="780" height="280" rx="10"
          fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="76" y="850" font-size="9" fill="#90A4AE">Maven lifecycle phases · plugins invoked · output</text>

    <!-- Phase boxes (horizontal flow) -->
    <rect x="80" y="862" width="140" height="62" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="150" y="880" text-anchor="middle" font-size="10" font-weight="700" fill="#1A5276">① validate</text>
    <text x="150" y="894" text-anchor="middle" font-size="9" fill="#2980B9">enforce profile</text>
    <text x="150" y="906" text-anchor="middle" font-size="9" fill="#2980B9">activation</text>
    <text x="150" y="918" text-anchor="middle" font-size="9" fill="#2980B9">(no plugin)</text>

    <line x1="220" y1="893" x2="240" y2="893" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="240" y="862" width="160" height="62" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="320" y="880" text-anchor="middle" font-size="10" font-weight="700" fill="#1A5276">② generate-resources
    </text>
    <text x="320" y="894" text-anchor="middle" font-size="9" fill="#2980B9">frontend-maven-plugin:</text>
    <text x="320" y="906" text-anchor="middle" font-size="9" fill="#2980B9">install-node-and-yarn,</text>
    <text x="320" y="918" text-anchor="middle" font-size="9" fill="#2980B9">yarn install, ng build</text>

    <line x1="400" y1="893" x2="420" y2="893" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="420" y="862" width="160" height="62" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="500" y="880" text-anchor="middle" font-size="10" font-weight="700" fill="#1A5276">③ compile</text>
    <text x="500" y="894" text-anchor="middle" font-size="9" fill="#2980B9">maven-compiler-plugin</text>
    <text x="500" y="906" text-anchor="middle" font-size="9" fill="#2980B9">+ hibernate-processor</text>
    <text x="500" y="918" text-anchor="middle" font-size="9" fill="#2980B9">(annotation processing)</text>

    <line x1="580" y1="893" x2="600" y2="893" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <rect x="600" y="862" width="220" height="62" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
    <text x="710" y="880" text-anchor="middle" font-size="10" font-weight="700" fill="#784212">④ package (the hot
        spot)
    </text>
    <text x="710" y="894" text-anchor="middle" font-size="9" fill="#A04000">quarkus-maven-plugin:build</text>
    <text x="710" y="906" text-anchor="middle" font-size="9" fill="#A04000">→ invokes GraalVM native-image</text>
    <text x="710" y="918" text-anchor="middle" font-size="9" fill="#A04000">→ produces *-runner binary</text>

    <!-- test phase note -->
    <text x="450" y="942" text-anchor="middle" font-size="9" font-style="italic" fill="#90A4AE">phases test /
        test-compile are skipped via -DskipTests; verify is no-op (no IT classes exist)
    </text>

    <!-- Profile/output matrix -->
    <text x="80" y="966" font-size="10" font-weight="700" fill="#212121">Native-image argument matrix (the only thing
        that differs between the three builds)
    </text>

    <!-- Header -->
    <rect x="80" y="976" width="240" height="24" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1"/>
    <text x="200" y="992" text-anchor="middle" font-size="10" font-weight="700" fill="#263238">Active profile</text>

    <rect x="320" y="976" width="280" height="24" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1"/>
    <text x="460" y="992" text-anchor="middle" font-size="10" font-weight="700" fill="#263238">Added build-arg</text>

    <rect x="600" y="976" width="220" height="24" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1"/>
    <text x="710" y="992" text-anchor="middle" font-size="10" font-weight="700" fill="#263238">Output binary
        characteristic
    </text>

    <!-- Row 1: instrumented -->
    <rect x="80" y="1002" width="240" height="32" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="200" y="1022" text-anchor="middle" font-size="10" font-weight="600" fill="#784212">native-pgo-instrument
    </text>

    <rect x="320" y="1002" width="280" height="32" rx="4" fill="#FFF8E1" stroke="#E67E22" stroke-width="1"/>
    <text x="460" y="1022" text-anchor="middle" font-size="10" font-family="monospace" fill="#784212">--pgo-instrument
    </text>

    <rect x="600" y="1002" width="220" height="32" rx="4" fill="#FFF8E1" stroke="#E67E22" stroke-width="1"/>
    <text x="710" y="1022" text-anchor="middle" font-size="10" fill="#784212">instrumented · ~500 MB</text>

    <!-- Row 2: optimized -->
    <rect x="80" y="1036" width="240" height="32" rx="4" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
    <text x="200" y="1056" text-anchor="middle" font-size="10" font-weight="600" fill="#145A32">native-release-pgo
    </text>

    <rect x="320" y="1036" width="280" height="32" rx="4" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
    <text x="460" y="1056" text-anchor="middle" font-size="10" font-family="monospace" fill="#145A32">
        --pgo=…default.iprof
    </text>

    <rect x="600" y="1036" width="220" height="32" rx="4" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
    <text x="710" y="1056" text-anchor="middle" font-size="10" fill="#145A32">PGO-optimized · ~80 MB</text>

    <!-- Row 3: fallback -->
    <rect x="80" y="1070" width="240" height="32" rx="4" fill="#FADBD8" stroke="#C0392B" stroke-width="1.5"/>
    <text x="200" y="1090" text-anchor="middle" font-size="10" font-weight="600" fill="#641E16">native-release
        (fallback)
    </text>

    <rect x="320" y="1070" width="280" height="32" rx="4" fill="#F9EBEA" stroke="#C0392B" stroke-width="1"/>
    <text x="460" y="1090" text-anchor="middle" font-size="10" font-family="monospace" fill="#641E16">(none)</text>

    <rect x="600" y="1070" width="220" height="32" rx="4" fill="#F9EBEA" stroke="#C0392B" stroke-width="1"/>
    <text x="710" y="1090" text-anchor="middle" font-size="10" fill="#641E16">non-PGO release · ~80 MB</text>

    <!-- Footnotes -->
    <text x="80" y="1136" font-size="9" font-style="italic" fill="#90A4AE">All three native builds inherit the same
        quarkus.native.additional-build-args base (UnlockExperimental, JNI, ServiceLoader, SecurityServices,
    </text>
    <text x="80" y="1148" font-size="9" font-style="italic" fill="#90A4AE">G1 GC, march=armv8-a+aes+lse on aarch64 /
        x86-64-v3 on x64) — the only difference is the appended PGO flag.
    </text>

    <text x="80" y="1170" font-size="9" font-style="italic" fill="#90A4AE">Inner Maven invocations share the host
        Maven's local repo (cache hit on subsequent compiles); Quarkus' incremental compile
    </text>
    <text x="80" y="1182" font-size="9" font-style="italic" fill="#90A4AE">won't skip the second native build —
        native-image always rebuilds from scratch — but the JVM compile phase reuses cached classes.
    </text>

    <!-- Legend -->
    <rect x="60" y="1208" width="780" height="60" rx="10"
          fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="76" y="1224" font-size="9" fill="#90A4AE">Legend</text>

    <rect x="80" y="1234" width="14" height="10" fill="#E8F8F5" stroke="#1ABC9C"/>
    <text x="100" y="1243" font-size="9" fill="#0E6655">User entry</text>

    <rect x="170" y="1234" width="14" height="10" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="190" y="1243" font-size="9" fill="#784212">Maven / native build (instrumented)</text>

    <rect x="380" y="1234" width="14" height="10" fill="#D5F5E3" stroke="#27AE60"/>
    <text x="400" y="1243" font-size="9" fill="#145A32">Maven / native build (optimized)</text>

    <rect x="580" y="1234" width="14" height="10" fill="#FADBD8" stroke="#C0392B"/>
    <text x="600" y="1243" font-size="9" fill="#641E16">Fallback (non-PGO)</text>

    <rect x="80" y="1252" width="14" height="10" fill="#D6EAF8" stroke="#2980B9"/>
    <text x="100" y="1261" font-size="9" fill="#1A5276">Setup / lifecycle phase</text>

    <rect x="240" y="1252" width="14" height="10" fill="#F4ECF7" stroke="#7D3C98"/>
    <text x="260" y="1261" font-size="9" fill="#512E5F">Profile collection</text>

    <rect x="380" y="1252" width="14" height="10" fill="#ECEFF1" stroke="#546E7A"/>
    <text x="400" y="1261" font-size="9" fill="#263238">Cleanup / utility</text>
</svg>
