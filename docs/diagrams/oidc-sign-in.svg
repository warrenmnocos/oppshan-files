<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <rect width="720" height="600" fill="#FAFAFA"/>

    <!-- Title -->
    <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#212121">OIDC sign-in sequence
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         Lifeline headers
         ═══════════════════════════════════════════════════════════ -->
    <rect x="60" y="40" width="120" height="40" rx="6" fill="#D6EAF8" stroke="#3498DB" stroke-width="1.5"/>
    <text x="120" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">Browser</text>
    <text x="120" y="72" text-anchor="middle" font-size="9" fill="#2E86C1">Angular SPA</text>

    <rect x="300" y="40" width="120" height="40" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="360" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">Quarkus app</text>
    <text x="360" y="72" text-anchor="middle" font-size="9" fill="#A04000">files.oppshan.com</text>

    <rect x="540" y="40" width="120" height="40" rx="6" fill="#FADBD8" stroke="#E74C3C" stroke-width="1.5"/>
    <text x="600" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#922B21">Google OIDC</text>
    <text x="600" y="72" text-anchor="middle" font-size="9" fill="#C0392B">accounts.google.com</text>

    <!-- ═══════════════════════════════════════════════════════════
         Lifelines (vertical dashed)
         ═══════════════════════════════════════════════════════════ -->
    <line x1="120" y1="80" x2="120" y2="558" stroke="#90A4AE" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="360" y1="80" x2="360" y2="558" stroke="#90A4AE" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="600" y1="80" x2="600" y2="558" stroke="#90A4AE" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- ═══════════════════════════════════════════════════════════
         Messages
         ═══════════════════════════════════════════════════════════ -->

    <!-- 1. Browser → Quarkus -->
    <line x1="124" y1="108" x2="356" y2="108" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="240" y="102" text-anchor="middle" font-size="10" fill="#37474F">1. GET /sso/sign-in/oidc/google</text>

    <!-- 2. Quarkus → Browser -->
    <line x1="356" y1="138" x2="124" y2="138" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="240" y="132" text-anchor="middle" font-size="10" fill="#37474F">2. 302 → Google authorize</text>

    <!-- 3. Browser → Google -->
    <line x1="124" y1="168" x2="596" y2="168" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="360" y="162" text-anchor="middle" font-size="10" fill="#37474F">3. GET /authorize?client_id, redirect_uri,
        scope
    </text>

    <!-- 4. Google → Browser -->
    <line x1="596" y1="198" x2="124" y2="198" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="360" y="192" text-anchor="middle" font-size="10" fill="#37474F">4. Sign-in + consent UI</text>

    <!-- 5. User authenticates (note on Browser lifeline) -->
    <rect x="60" y="218" width="160" height="22" rx="4" fill="#FFF8E1" stroke="#F39C12" stroke-width="1"/>
    <text x="140" y="233" text-anchor="middle" font-size="9" fill="#7E5109" font-style="italic">5. user authenticates
    </text>

    <!-- 6. Google → Browser -->
    <line x1="596" y1="262" x2="124" y2="262" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="360" y="256" text-anchor="middle" font-size="10" fill="#37474F">6. 302 →
        /sso/sign-in/oidc/callback/google?code=…
    </text>

    <!-- 7. Browser → Quarkus -->
    <line x1="124" y1="292" x2="356" y2="292" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="240" y="286" text-anchor="middle" font-size="10" fill="#37474F">7. GET /callback/google?code=…</text>

    <!-- 8. Quarkus → Google -->
    <line x1="364" y1="322" x2="596" y2="322" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="480" y="316" text-anchor="middle" font-size="10" fill="#37474F">8. POST /token (code → tokens)</text>

    <!-- 9. Google → Quarkus -->
    <line x1="596" y1="352" x2="364" y2="352" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="480" y="346" text-anchor="middle" font-size="10" fill="#37474F">9. id_token (sub, name, email, picture)
    </text>

    <!-- 10. Quarkus self: validate JWT -->
    <rect x="364" y="370" width="180" height="22" rx="4" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1"/>
    <text x="454" y="385" text-anchor="middle" font-size="9" fill="#0E6655" font-style="italic">10. validate JWT against
        Google JWKS
    </text>

    <!-- 11. Quarkus self: find-or-create -->
    <rect x="364" y="402" width="320" height="38" rx="4" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1"/>
    <text x="524" y="418" text-anchor="middle" font-size="9" fill="#0E6655" font-style="italic">11. find-or-create
        UserAccount + GoogleAccount
    </text>
    <text x="524" y="432" text-anchor="middle" font-size="9" fill="#0E6655" font-style="italic">+ UserStorage + root
        FileNode (single tx)
    </text>

    <!-- 12. Quarkus → Browser -->
    <line x1="356" y1="466" x2="124" y2="466" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="240" y="453" text-anchor="middle" font-size="10" fill="#37474F">12. 302 / + Set-Cookie</text>
    <text x="240" y="464" text-anchor="middle" font-size="9" fill="#546E7A">(HttpOnly · encrypted token state)</text>

    <!-- 13. Browser → Quarkus -->
    <line x1="124" y1="496" x2="356" y2="496" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="240" y="490" text-anchor="middle" font-size="10" fill="#37474F">13. GET / (cookie attached)</text>

    <!-- 14. Quarkus → Browser -->
    <line x1="356" y1="528" x2="124" y2="528" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="240" y="522" text-anchor="middle" font-size="10" fill="#37474F">14. Angular app (signed-in)</text>

    <!-- ═══════════════════════════════════════════════════════════
         Footer note
         ═══════════════════════════════════════════════════════════ -->
    <rect x="30" y="566" width="660" height="26" rx="6" fill="none" stroke="#90A4AE" stroke-width="1"
          stroke-dasharray="6 4"/>
    <text x="44" y="582" font-size="9" fill="#546E7A" font-style="italic">Quarkus token state is encrypted in the cookie
        via <tspan font-family="Menlo, Consolas, monospace">quarkus.oidc.token-state-manager.encryption-secret</tspan>;
        the SPA never touches the token directly.
    </text>
</svg>
