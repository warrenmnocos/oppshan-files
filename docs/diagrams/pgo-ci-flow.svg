<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <rect width="800" height="900" fill="#FAFAFA"/>

    <!-- Title -->
    <text x="400" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#212121">CI PGO deploy (Phase B)
    </text>
    <text x="400" y="40" text-anchor="middle" font-size="9" fill="#90A4AE">.github/workflows/deploy.yml ·
        ubuntu-24.04-arm (4 vCPU / 16 GB) · timeout-minutes: 70 · 4 executable steps
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         services: block — autostarted at job entry
         ═══════════════════════════════════════════════════════════ -->
    <rect x="20" y="56" width="500" height="76" rx="10"
          fill="none" stroke="#1ABC9C" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="36" y="72" font-size="9" fill="#0E6655">services: (autostarted at job entry, persistent until job end)
    </text>

    <rect x="36" y="82" width="232" height="40" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="152" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6655">postgres:18</text>
    <text x="152" y="113" text-anchor="middle" font-size="9" fill="#1ABC9C">:5432 · POSTGRES_DB=oppshan</text>

    <rect x="272" y="82" width="232" height="40" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="388" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6655">keycloak:26.0.6</text>
    <text x="388" y="113" text-anchor="middle" font-size="9" fill="#1ABC9C">:8180 · KC_HTTP_PORT=8180 · start-dev</text>

    <!-- ═══════════════════════════════════════════════════════════
         4-step workflow column
         ═══════════════════════════════════════════════════════════ -->
    <text x="36" y="152" font-size="9" fill="#546E7A" font-weight="600">Workflow steps (4 executable, after
        checkout/setup-java)
    </text>

    <!-- Step 1: checkout + setup-java -->
    <rect x="36" y="158" width="468" height="48" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <text x="270" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">① Checkout · setup
        GraalVM 25
    </text>
    <text x="270" y="192" text-anchor="middle" font-size="9" fill="#546E7A">actions/checkout@v4 · actions/setup-java@v4
        (distribution: graalvm, cache: maven)
    </text>
    <line x1="270" y1="206" x2="270" y2="220" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step 2: JVM tests -->
    <rect x="36" y="222" width="468" height="48" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <text x="270" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">② JVM tests</text>
    <text x="270" y="256" text-anchor="middle" font-size="9" fill="#546E7A">./mvnw -B test (existing — runs the
        @QuarkusTest suite)
    </text>
    <line x1="270" y1="270" x2="270" y2="284" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step 3: mvn -Ppgo exec:exec — the BIG one -->
    <rect x="36" y="286" width="468" height="282" rx="8" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
    <text x="270" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">③ Build PGO-optimized
        native binary
    </text>
    <text x="270" y="324" text-anchor="middle" font-size="10" fill="#A04000" font-family="monospace">./mvnw -B -Ppgo
        exec:exec
    </text>
    <text x="270" y="340" text-anchor="middle" font-size="9" font-style="italic" fill="#A04000">env:
        PGO_DOCKER_MANAGED=external · PGO_OIDC_CLIENT_SECRET · TOKEN_ENCRYPTION_SECRET ·
        APP_STORAGE_ENCRYPTION_PASSPHRASE
    </text>

    <!-- internal phases shown as a stack -->
    <text x="60" y="362" font-size="9" fill="#A04000" font-weight="600">Internally, the bash script
        (graalvm-pgo/local.sh) runs:
    </text>

    <rect x="60" y="370" width="420" height="22" rx="4" fill="#D6EAF8" stroke="#2980B9" stroke-width="1"/>
    <text x="270" y="385" text-anchor="middle" font-size="9" fill="#1A5276">a. wait for services readiness ·
        keycloak-bootstrap.sh
    </text>

    <rect x="60" y="394" width="420" height="22" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="270" y="409" text-anchor="middle" font-size="9" fill="#784212">b. inner mvn: -Pnative-pgo-instrument
        package (~15 min)
    </text>

    <rect x="60" y="418" width="420" height="22" rx="4" fill="#F4ECF7" stroke="#7D3C98" stroke-width="1"/>
    <text x="270" y="433" text-anchor="middle" font-size="9" fill="#512E5F">c. launch binary · workload.sh · SIGTERM +
        test -s default.iprof
    </text>

    <rect x="60" y="442" width="420" height="22" rx="4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1"/>
    <text x="270" y="457" text-anchor="middle" font-size="9" fill="#263238">d. docker stop keycloak (free RAM before
        optimized build)
    </text>

    <rect x="60" y="466" width="420" height="22" rx="4" fill="#D5F5E3" stroke="#27AE60" stroke-width="1"/>
    <text x="270" y="481" text-anchor="middle" font-size="9" fill="#145A32">e. inner mvn: -Pnative-release-pgo package
        -Dpgo.profile.path=… (~15 min)
    </text>

    <rect x="60" y="490" width="420" height="22" rx="4" fill="#FADBD8" stroke="#C0392B" stroke-width="1"
          stroke-dasharray="3 2"/>
    <text x="270" y="505" text-anchor="middle" font-size="9" fill="#641E16">fallback (if any of b/c/d/e fail): inner
        mvn: -Pnative-release package
    </text>

    <text x="270" y="528" text-anchor="middle" font-size="9" font-style="italic" fill="#A04000">Same script as Phase A —
        see docs/diagrams/pgo-maven-build.svg for the Maven detail.
    </text>
    <text x="270" y="542" text-anchor="middle" font-size="9" font-style="italic" fill="#A04000">Always exits 0;
        whichever binary lands in target/ is what step ④ deploys.
    </text>

    <line x1="270" y1="568" x2="270" y2="582" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step 4: AWS deploy -->
    <rect x="36" y="584" width="468" height="48" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
    <text x="270" y="603" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">④ AWS deploy</text>
    <text x="270" y="618" text-anchor="middle" font-size="9" fill="#546E7A">aws-actions/configure-aws-credentials@v4 ·
        S3 cp · SSM Run Command (existing)
    </text>
    <line x1="270" y1="632" x2="270" y2="646" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Result -->
    <rect x="120" y="648" width="300" height="48" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
    <text x="270" y="667" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">aarch64 binary deployed
        to EC2
    </text>
    <text x="270" y="682" text-anchor="middle" font-size="9" fill="#27AE60">PGO-optimized (success path) or non-PGO
        release (fallback)
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         Right column: AWS targets + key invariants
         ═══════════════════════════════════════════════════════════ -->
    <rect x="540" y="156" width="244" height="218" rx="10"
          fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="556" y="172" font-size="9" fill="#90A4AE">AWS deploy targets (existing)</text>

    <rect x="556" y="182" width="212" height="44" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="662" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6655">S3 artifact bucket</text>
    <text x="662" y="216" text-anchor="middle" font-size="9" fill="#1ABC9C">releases/&lt;short-sha&gt;.runner</text>

    <rect x="556" y="234" width="212" height="44" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="662" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6655">SSM Run Command</text>
    <text x="662" y="268" text-anchor="middle" font-size="9" fill="#1ABC9C">systemctl stop · s3 cp · systemctl start
    </text>

    <rect x="556" y="286" width="212" height="44" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="662" y="304" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6655">EC2 t4g.small
        (oppshan-files)
    </text>
    <text x="662" y="320" text-anchor="middle" font-size="9" fill="#1ABC9C">2 vCPU · 2 GB · Caddy + PG + binary</text>

    <text x="662" y="350" text-anchor="middle" font-size="9" font-style="italic" fill="#90A4AE">SSM uses the runner
        identity
    </text>
    <text x="662" y="362" text-anchor="middle" font-size="9" font-style="italic" fill="#90A4AE">via OIDC federation — no
        SSH keys
    </text>

    <!-- Symmetry / what changed -->
    <rect x="540" y="386" width="244" height="220" rx="10"
          fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="556" y="402" font-size="9" fill="#90A4AE">Local ↔ CI symmetry</text>

    <rect x="556" y="412" width="212" height="40" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="662" y="429" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6655">Local invocation</text>
    <text x="662" y="443" text-anchor="middle" font-size="9" fill="#1ABC9C">./mvnw -Ppgo exec:exec</text>

    <rect x="556" y="460" width="212" height="40" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="662" y="477" text-anchor="middle" font-size="10" font-weight="700" fill="#0E6655">CI invocation</text>
    <text x="662" y="491" text-anchor="middle" font-size="9" fill="#1ABC9C">./mvnw -Ppgo exec:exec (identical)</text>

    <text x="662" y="514" text-anchor="middle" font-size="9" fill="#546E7A">Only difference: env vars set by CI</text>
    <text x="662" y="526" text-anchor="middle" font-size="9" fill="#546E7A">(PGO_DOCKER_MANAGED=external)</text>

    <text x="662" y="552" text-anchor="middle" font-size="9" font-style="italic" fill="#90A4AE">Orchestration logic
        lives in one
    </text>
    <text x="662" y="564" text-anchor="middle" font-size="9" font-style="italic" fill="#90A4AE">place:
        scripts/graalvm-pgo/local.sh.
    </text>
    <text x="662" y="576" text-anchor="middle" font-size="9" font-style="italic" fill="#90A4AE">No YAML/script
        divergence.
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         Legend
         ═══════════════════════════════════════════════════════════ -->
    <rect x="20" y="720" width="764" height="78" rx="10"
          fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="36" y="736" font-size="9" fill="#90A4AE">Legend</text>

    <rect x="36" y="746" width="14" height="10" fill="#ECEFF1" stroke="#546E7A"/>
    <text x="56" y="755" font-size="9" fill="#263238">Existing / utility</text>

    <rect x="160" y="746" width="14" height="10" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="180" y="755" font-size="9" fill="#784212">Build (instrumented)</text>

    <rect x="300" y="746" width="14" height="10" fill="#D5F5E3" stroke="#27AE60"/>
    <text x="320" y="755" font-size="9" fill="#145A32">Build (optimized) / Result</text>

    <rect x="470" y="746" width="14" height="10" fill="#F4ECF7" stroke="#7D3C98"/>
    <text x="490" y="755" font-size="9" fill="#512E5F">Profile collection</text>

    <rect x="600" y="746" width="14" height="10" fill="#FADBD8" stroke="#C0392B"/>
    <text x="620" y="755" font-size="9" fill="#641E16">Fallback (non-PGO)</text>

    <rect x="36" y="768" width="14" height="10" fill="#D6EAF8" stroke="#2980B9"/>
    <text x="56" y="777" font-size="9" fill="#1A5276">Setup / readiness</text>

    <rect x="160" y="768" width="14" height="10" fill="#E8F8F5" stroke="#1ABC9C"/>
    <text x="180" y="777" font-size="9" fill="#0E6655">Infra / AWS</text>

    <text x="36" y="794" font-size="9" font-style="italic" fill="#90A4AE">Total CI time per deploy: ~50-60 min (PGO
        success path) · ~25-30 min (fallback path) · GitHub job ceiling: 6 hours
    </text>

    <text x="400" y="836" text-anchor="middle" font-size="10" font-weight="600" fill="#546E7A">For the inner Maven
        detail (lifecycle phases, plugin goals, native-image flag matrix),
    </text>
    <text x="400" y="852" text-anchor="middle" font-size="10" font-weight="600" fill="#546E7A">see
        docs/diagrams/pgo-maven-build.svg
    </text>
</svg>
