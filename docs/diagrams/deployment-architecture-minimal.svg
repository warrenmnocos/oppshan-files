<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" width="820" height="760"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
        <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="820" height="760" fill="#FAFAFA"/>

    <!-- ── Browser ─────────────────────────────────────────────── -->
    <rect x="20" y="18" width="148" height="54" rx="8"
          fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="94" y="40" text-anchor="middle" font-weight="600" fill="#424242">Browser</text>
    <text x="94" y="57" text-anchor="middle" font-size="10" fill="#757575">Angular 21 SPA</text>

    <!-- ── Google OIDC ─────────────────────────────────────────── -->
    <rect x="648" y="18" width="152" height="54" rx="8"
          fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="724" y="40" text-anchor="middle" font-weight="600" fill="#424242">Google</text>
    <text x="724" y="57" text-anchor="middle" font-size="10" fill="#757575">OIDC Provider</text>

    <!-- ── AWS boundary ───────────────────────────────────────── -->
    <rect x="10" y="96" width="800" height="588" rx="12"
          fill="#EBF5FB" stroke="#5DADE2" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="26" y="115" font-size="10" font-weight="700" fill="#2980B9" letter-spacing="0.5">AWS</text>

    <!-- ── Route 53 ───────────────────────────────────────────── -->
    <rect x="38" y="122" width="172" height="52" rx="6"
          fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="124" y="143" text-anchor="middle" font-weight="600" fill="#1A5276">Route 53</text>
    <text x="124" y="160" text-anchor="middle" font-size="10" fill="#2980B9">files.oppshan.com → EIP</text>

    <!-- ── EC2 Security Group ─────────────────────────────────── -->
    <rect x="24" y="190" width="772" height="396" rx="10"
          fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <text x="40" y="207" font-size="9" font-weight="700" fill="#C0392B" letter-spacing="0.3">
        SG: ec2-oppshan · inbound :443 from 0.0.0.0/0
    </text>

    <!-- ── EC2 boundary ───────────────────────────────────────── -->
    <rect x="32" y="214" width="756" height="364" rx="8"
          fill="#DDEEFF" stroke="#2874A6" stroke-width="1.5"/>
    <text x="48" y="233" font-size="10" font-weight="700" fill="#1A5276" letter-spacing="0.3">
        EC2 t4g.small · ARM64 · Amazon Linux 2023
    </text>

    <!-- ── Caddy ─────────────────────────────────────────────── -->
    <rect x="50" y="242" width="210" height="68" rx="6"
          fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5"/>
    <text x="155" y="264" text-anchor="middle" font-weight="700" fill="#145A32">Caddy :443</text>
    <text x="155" y="281" text-anchor="middle" font-size="10" fill="#1E8449">TLS termination</text>
    <text x="155" y="296" text-anchor="middle" font-size="10" fill="#1E8449">wildcard *.oppshan.com · DNS-01</text>

    <!-- ── Quarkus boundary ───────────────────────────────────── -->
    <rect x="50" y="334" width="490" height="236" rx="8"
          fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1.5"/>
    <text x="66" y="353" font-size="10" font-weight="700" fill="#9A7D0A" letter-spacing="0.3">
        Quarkus 3 native binary · localhost:8080
    </text>

    <!-- ── Endpoint Layer ─────────────────────────────────────── -->
    <rect x="65" y="364" width="460" height="86" rx="5"
          fill="#FFF8E1" stroke="#F57F17" stroke-width="1"/>
    <text x="80" y="380" font-size="10" font-weight="600" fill="#E65100">Endpoint Layer</text>
    <text x="80" y="394" font-size="9" fill="#F57F17">
        Virtual Threads · Jakarta Servlet · JAX-RS · Undertow
    </text>

    <!-- Route handler boxes -->
    <rect x="75" y="404" width="90" height="40" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="120" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/</text>
    <text x="120" y="437" text-anchor="middle" font-size="9" fill="#A04000">Static bundle</text>

    <rect x="173" y="404" width="106" height="40" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="226" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/api/**</text>
    <text x="226" y="437" text-anchor="middle" font-size="9" fill="#A04000">JAX-RS endpoints</text>

    <rect x="287" y="404" width="106" height="40" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="340" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/sso/**</text>
    <text x="340" y="437" text-anchor="middle" font-size="9" fill="#A04000">OIDC flows</text>

    <rect x="401" y="404" width="90" height="40" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="446" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/**</text>
    <text x="446" y="437" text-anchor="middle" font-size="9" fill="#A04000">SPA fallback</text>

    <!-- ── Service Layer ──────────────────────────────────────── -->
    <rect x="65" y="460" width="270" height="56" rx="5"
          fill="#FFF8E1" stroke="#F57F17" stroke-width="1"/>
    <text x="80" y="479" font-size="10" font-weight="600" fill="#E65100">Service Layer</text>
    <text x="80" y="495" font-size="9" fill="#F57F17">Jakarta Transactions</text>

    <!-- ── Security ───────────────────────────────────────────── -->
    <rect x="345" y="460" width="180" height="56" rx="5"
          fill="#E0F7FA" stroke="#00838F" stroke-width="1"/>
    <text x="360" y="479" font-size="10" font-weight="600" fill="#006064">Security</text>
    <text x="360" y="495" font-size="9" fill="#00838F">OIDC extension</text>
    <text x="360" y="509" font-size="9" fill="#00838F">AES/CTR/NoPadding encryption</text>

    <!-- ── Miscellaneous ──────────────────────────────────────── -->
    <rect x="65" y="526" width="130" height="38" rx="5"
          fill="#ECEFF1" stroke="#546E7A" stroke-width="1"/>
    <text x="80" y="545" font-size="10" font-weight="600" fill="#37474F">Miscellaneous</text>
    <text x="80" y="558" font-size="9" fill="#546E7A">MicroProfile Config</text>

    <!-- ── Repository Layer ───────────────────────────────────── -->
    <rect x="205" y="526" width="320" height="38" rx="5"
          fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1"/>
    <text x="220" y="545" font-size="10" font-weight="600" fill="#4A148C">Repository Layer</text>
    <text x="220" y="558" font-size="9" fill="#6A1B9A">Jakarta Persistence · Jakarta Data · Hibernate ORM</text>

    <!-- ── PostgreSQL Security Group ──────────────────────────── -->
    <rect x="556" y="492" width="236" height="82" rx="8"
          fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <text x="572" y="508" font-size="9" font-weight="700" fill="#C0392B" letter-spacing="0.3">
        SG: db-oppshan · inbound :5432 from ec2-sg
    </text>

    <!-- ── PostgreSQL ─────────────────────────────────────────── -->
    <rect x="566" y="514" width="216" height="54" rx="6"
          fill="#F4ECF7" stroke="#7D3C98" stroke-width="1.5"/>
    <text x="674" y="534" text-anchor="middle" font-weight="700" fill="#512E5F">PostgreSQL 18</text>
    <text x="674" y="550" text-anchor="middle" font-size="10" fill="#7D3C98">localhost:5432</text>
    <text x="674" y="564" text-anchor="middle" font-size="9" fill="#7D3C98">Large Objects · AES-CTR encrypted</text>

    <!-- ── CI/CD: S3 and SSM (inside AWS, outside EC2) ────────── -->
    <rect x="214" y="606" width="100" height="36" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="264" y="623" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">S3</text>
    <text x="264" y="636" text-anchor="middle" font-size="9" fill="#717D7E">artifact store</text>

    <rect x="362" y="606" width="138" height="36" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="431" y="623" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">SSM Run Command</text>
    <text x="431" y="636" text-anchor="middle" font-size="9" fill="#717D7E">deploy · no SSH</text>

    <!-- ── CI/CD: GitHub Actions (outside AWS) ────────────────── -->
    <rect x="187" y="700" width="154" height="44" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="264" y="718" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">GitHub Actions</text>
    <text x="264" y="733" text-anchor="middle" font-size="9" fill="#717D7E">OIDC → AWS STS · ARM64 build</text>

    <!-- ── Arrows ────────────────────────────────────────────── -->
    <!-- Browser → Route 53 -->
    <line x1="94" y1="72" x2="100" y2="122" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="32" y="103" font-size="9" fill="#546E7A">HTTPS</text>

    <!-- Route 53 → Caddy (A record) -->
    <line x1="124" y1="174" x2="132" y2="242" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="136" y="213" font-size="9" fill="#546E7A">A record → EIP</text>

    <!-- Caddy → Quarkus (HTTP proxy) -->
    <line x1="155" y1="310" x2="208" y2="334" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="128" y="329" font-size="9" fill="#546E7A">HTTP proxy</text>

    <!-- Repository → PostgreSQL (JDBC) -->
    <line x1="525" y1="545" x2="566" y2="541" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="546" y="535" font-size="9" text-anchor="middle" fill="#546E7A">JDBC</text>

    <!-- Quarkus ↔ Google OIDC -->
    <path d="M 498 334 Q 620 160 724 72" stroke="#546E7A" stroke-width="1.5" fill="none"
          marker-end="url(#arr)" marker-start="url(#arr-b)"/>
    <text x="590" y="200" font-size="9" fill="#546E7A">OAuth 2.0</text>

    <!-- CI/CD arrows -->
    <!-- GitHub Actions → S3 (crosses AWS boundary) -->
    <line x1="264" y1="700" x2="264" y2="642" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="274" y="676" font-size="9" fill="#546E7A">upload</text>
    <!-- S3 → SSM -->
    <line x1="314" y1="624" x2="362" y2="624" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- SSM → EC2 (deploy) -->
    <path d="M 431 606 L 431 586" stroke="#546E7A" stroke-width="1.5" fill="none"
          stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="441" y="598" font-size="9" fill="#546E7A">deploy</text>
</svg>
