<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 550" width="820" height="550"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
        <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="820" height="550" fill="#FAFAFA"/>

    <!-- ── Browser ─────────────────────────────────────────────── -->
    <rect x="20" y="18" width="148" height="54" rx="8"
          fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="94" y="40" text-anchor="middle" font-weight="600" fill="#424242">Browser</text>
    <text x="94" y="57" text-anchor="middle" font-size="10" fill="#757575">Angular 21 SPA</text>

    <!-- ── Google OIDC ─────────────────────────────────────────── -->
    <rect x="648" y="18" width="152" height="54" rx="8"
          fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="724" y="40" text-anchor="middle" font-weight="600" fill="#424242">Google</text>
    <text x="724" y="57" text-anchor="middle" font-size="10" fill="#757575">OIDC Provider</text>

    <!-- ── AWS boundary ───────────────────────────────────────── -->
    <rect x="10" y="96" width="800" height="425" rx="12"
          fill="#EBF5FB" stroke="#5DADE2" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="26" y="115" font-size="10" font-weight="700" fill="#2980B9" letter-spacing="0.5">AWS</text>

    <!-- ── Route 53 ───────────────────────────────────────────── -->
    <rect x="38" y="122" width="172" height="52" rx="6"
          fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="124" y="143" text-anchor="middle" font-weight="600" fill="#1A5276">Route 53</text>
    <text x="124" y="160" text-anchor="middle" font-size="10" fill="#2980B9">files.oppshan.com → EIP</text>

    <!-- ── EC2 boundary ───────────────────────────────────────── -->
    <rect x="24" y="196" width="772" height="300" rx="10"
          fill="#DDEEFF" stroke="#2874A6" stroke-width="1.5"/>
    <text x="40" y="215" font-size="10" font-weight="700" fill="#1A5276" letter-spacing="0.3">
        EC2 t4g.small · ARM64 · Amazon Linux 2023
    </text>

    <!-- ── Caddy ─────────────────────────────────────────────── -->
    <rect x="42" y="224" width="210" height="68" rx="6"
          fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5"/>
    <text x="147" y="246" text-anchor="middle" font-weight="700" fill="#145A32">Caddy :443</text>
    <text x="147" y="263" text-anchor="middle" font-size="10" fill="#1E8449">TLS termination</text>
    <text x="147" y="278" text-anchor="middle" font-size="10" fill="#1E8449">wildcard *.oppshan.com · DNS-01</text>

    <!-- ── Quarkus boundary ───────────────────────────────────── -->
    <rect x="42" y="316" width="490" height="162" rx="8"
          fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1.5"/>
    <text x="58" y="335" font-size="10" font-weight="700" fill="#9A7D0A" letter-spacing="0.3">
        Quarkus 3 native binary · localhost:8080
    </text>
    <text x="58" y="350" font-size="10" fill="#B7950B">
        Virtual threads · JAX-RS · Hibernate ORM · OIDC extension
    </text>

    <!-- Route handler boxes -->
    <rect x="57" y="360" width="100" height="52" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="107" y="381" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">/</text>
    <text x="107" y="397" text-anchor="middle" font-size="9" fill="#A04000">Static bundle</text>

    <rect x="168" y="360" width="116" height="52" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="226" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/api/**</text>
    <text x="226" y="393" text-anchor="middle" font-size="9" fill="#A04000">JAX-RS</text>
    <text x="226" y="406" text-anchor="middle" font-size="9" fill="#A04000">FileSystem · Auth</text>

    <rect x="295" y="360" width="116" height="52" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="353" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/sso/**</text>
    <text x="353" y="393" text-anchor="middle" font-size="9" fill="#A04000">OIDC sign-in</text>
    <text x="353" y="406" text-anchor="middle" font-size="9" fill="#A04000">sign-out · callback</text>

    <rect x="422" y="360" width="100" height="52" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="472" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">/**</text>
    <text x="472" y="393" text-anchor="middle" font-size="9" fill="#A04000">SPA fallback</text>
    <text x="472" y="406" text-anchor="middle" font-size="9" fill="#A04000">→ /index.html</text>

    <!-- ── PostgreSQL ─────────────────────────────────────────── -->
    <rect x="548" y="330" width="230" height="82" rx="6"
          fill="#F4ECF7" stroke="#7D3C98" stroke-width="1.5"/>
    <text x="663" y="353" text-anchor="middle" font-weight="700" fill="#512E5F">PostgreSQL 18</text>
    <text x="663" y="369" text-anchor="middle" font-size="10" fill="#7D3C98">localhost:5432</text>
    <text x="663" y="384" text-anchor="middle" font-size="10" fill="#7D3C98">FileNode · UserAccount · UserStorage</text>
    <text x="663" y="399" text-anchor="middle" font-size="10" fill="#7D3C98">Large Objects (AES-CTR encrypted)</text>

    <!-- ── CI/CD strip ────────────────────────────────────────── -->
    <rect x="42" y="444" width="154" height="44" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="119" y="462" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">GitHub Actions</text>
    <text x="119" y="477" text-anchor="middle" font-size="9" fill="#717D7E">OIDC → AWS STS · ARM64 build</text>

    <rect x="214" y="452" width="100" height="36" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="264" y="469" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">S3</text>
    <text x="264" y="482" text-anchor="middle" font-size="9" fill="#717D7E">artifact store</text>

    <rect x="332" y="452" width="138" height="36" rx="6" fill="#F0F3F4" stroke="#717D7E" stroke-width="1.2"/>
    <text x="401" y="469" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">SSM Run Command</text>
    <text x="401" y="482" text-anchor="middle" font-size="9" fill="#717D7E">deploy · no SSH</text>

    <!-- ── Arrows ────────────────────────────────────────────── -->
    <!-- Browser → Route 53 -->
    <line x1="94" y1="72" x2="100" y2="122" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="32" y="103" font-size="9" fill="#546E7A">HTTPS</text>

    <!-- Route 53 → Caddy (A record) -->
    <line x1="124" y1="174" x2="124" y2="224" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="128" y="205" font-size="9" fill="#546E7A">A record → EIP</text>

    <!-- Caddy → Quarkus (HTTP proxy) -->
    <line x1="147" y1="292" x2="200" y2="316" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="120" y="311" font-size="9" fill="#546E7A">HTTP proxy</text>

    <!-- /api/ → PostgreSQL (JDBC) -->
    <path d="M 284 386 Q 416 366 548 371" stroke="#546E7A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="398" y="365" font-size="9" fill="#546E7A">JDBC</text>

    <!-- /sso/ ↔ Google OIDC -->
    <path d="M 411 386 Q 620 190 724 72" stroke="#546E7A" stroke-width="1.5" fill="none"
          marker-end="url(#arr)" marker-start="url(#arr-b)"/>
    <text x="572" y="218" font-size="9" fill="#546E7A">OAuth 2.0</text>

    <!-- CI/CD arrows -->
    <line x1="196" y1="470" x2="214" y2="470" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="314" y1="470" x2="332" y2="470" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- SSM → EC2 boundary -->
    <path d="M 401 452 Q 401 430 400 400" stroke="#546E7A" stroke-width="1.5" fill="none"
          stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="406" y="432" font-size="9" fill="#546E7A">deploy</text>
</svg>
