<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <rect width="720" height="560" fill="#FAFAFA"/>

    <!-- Title -->
    <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#212121">Build pipeline</text>

    <!-- ═══════════════════════════════════════════════════════════
         SOURCE — Single Repository
         ═══════════════════════════════════════════════════════════ -->
    <rect x="30" y="36" width="660" height="62" rx="10"
          fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="50" y="52" font-size="9" fill="#90A4AE">Single Repository</text>

    <!-- Angular source -->
    <rect x="44" y="58" width="295" height="34" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="191" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6655">src/main/angular/</text>
    <text x="191" y="87" text-anchor="middle" font-size="9" fill="#1ABC9C">Angular 21 · TypeScript · SCSS</text>

    <!-- Java source -->
    <rect x="381" y="58" width="295" height="34" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="528" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">src/main/java/</text>
    <text x="528" y="87" text-anchor="middle" font-size="9" fill="#E67E22">Quarkus 3 · Java 25 · JAX-RS</text>

    <!-- Arrow: Angular → Step 1 -->
    <line x1="191" y1="92" x2="191" y2="118" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Arrow: Java → Step 5 (long vertical on right side) -->
    <line x1="528" y1="92" x2="528" y2="380" stroke="#546E7A" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="528" y1="380" x2="528" y2="396" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="536" y="240" font-size="9" fill="#90A4AE" transform="rotate(90 536 240)">waits for frontend build</text>

    <!-- ═══════════════════════════════════════════════════════════
         MAVEN generate-resources PHASE (frontend build)
         ═══════════════════════════════════════════════════════════ -->
    <text x="44" y="113" font-size="9" fill="#2980B9" font-weight="600">Maven phase: generate-resources</text>

    <!-- Step 1: frontend-maven-plugin -->
    <rect x="44" y="120" width="430" height="36" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="259" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">
        ① frontend-maven-plugin
    </text>
    <text x="259" y="150" text-anchor="middle" font-size="9" fill="#2980B9">
        provisions project-local Node.js 22 + Yarn into target/
    </text>

    <!-- Arrow 1→2 -->
    <line x1="259" y1="156" x2="259" y2="174" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step 2: yarn install -->
    <rect x="44" y="176" width="430" height="36" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="259" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">
        ② yarn install
    </text>
    <text x="259" y="206" text-anchor="middle" font-size="9" fill="#2980B9">
        --frozen-lockfile · installs Angular dependencies from yarn.lock
    </text>

    <!-- Arrow 2→3 -->
    <line x1="259" y1="212" x2="259" y2="230" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step 3: ng build -->
    <rect x="44" y="232" width="430" height="36" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="259" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">
        ③ ng build
    </text>
    <text x="259" y="262" text-anchor="middle" font-size="9" fill="#2980B9">
        compiles Angular SPA to static bundle (HTML, CSS, JS)
    </text>

    <!-- Arrow 3→4 -->
    <line x1="259" y1="268" x2="259" y2="286" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Step 4: Output to META-INF/resources -->
    <rect x="44" y="288" width="430" height="36" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
    <text x="259" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">
        ④ Angular bundle → target/classes/META-INF/resources/
    </text>
    <text x="259" y="318" text-anchor="middle" font-size="9" fill="#27AE60">
        Quarkus classpath location for static content
    </text>

    <!-- Arrow 4→5 -->
    <line x1="259" y1="324" x2="259" y2="350" stroke="#546E7A" stroke-width="1.2"/>
    <line x1="259" y1="350" x2="360" y2="396" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- ═══════════════════════════════════════════════════════════
         MAVEN compile + package PHASE
         ═══════════════════════════════════════════════════════════ -->
    <text x="44" y="393" font-size="9" fill="#E67E22" font-weight="600">Maven phase: compile + package</text>

    <!-- Step 5: Compile + package -->
    <rect x="44" y="398" width="632" height="42" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="360" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">
        ⑤ Maven compiles Java sources · Quarkus packages single artifact
    </text>
    <text x="360" y="432" text-anchor="middle" font-size="9" fill="#A04000">
        frontend bundle + backend classes + dependencies → one self-contained binary
    </text>

    <!-- Arrow 5→artifact -->
    <line x1="360" y1="440" x2="360" y2="462" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- ═══════════════════════════════════════════════════════════
         ARTIFACT
         ═══════════════════════════════════════════════════════════ -->
    <rect x="160" y="464" width="400" height="36" rx="6" fill="#F4ECF7" stroke="#7D3C98" stroke-width="1.5"/>
    <text x="360" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="#512E5F">
        Single Artifact
    </text>
    <text x="360" y="494" text-anchor="middle" font-size="9" fill="#7D3C98">
        uber-jar (java -jar) · or GraalVM native binary (~70–90 MB)
    </text>

    <!-- Arrow artifact→runtime -->
    <line x1="360" y1="500" x2="360" y2="518" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- ═══════════════════════════════════════════════════════════
         RUNTIME
         ═══════════════════════════════════════════════════════════ -->
    <rect x="44" y="520" width="632" height="30" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1"/>
    <rect x="44" y="520" width="316" height="30" rx="6" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1"/>
    <rect x="360" y="520" width="316" height="30" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1"/>
    <text x="202" y="539" text-anchor="middle" font-size="10" font-weight="600" fill="#0E6655">
        / → Angular SPA (static files)
    </text>
    <text x="518" y="539" text-anchor="middle" font-size="10" font-weight="600" fill="#784212">
        /api/** → JAX-RS (REST endpoints)
    </text>
    <text x="360" y="539" text-anchor="middle" font-size="10" fill="#546E7A">│</text>

    <!-- Runtime label -->
    <text x="360" y="514" text-anchor="middle" font-size="9" fill="#90A4AE">Runtime · localhost:8080 · same origin
    </text>
</svg>