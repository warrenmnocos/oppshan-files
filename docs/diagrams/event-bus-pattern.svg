<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <rect width="720" height="600" fill="#FAFAFA"/>

    <!-- Title -->
    <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#212121">Event bus and reactive
        pattern
    </text>

    <!-- ═══════════════════════════════════════════════════════════
         Bus spine (highlighted vertical column)
         ═══════════════════════════════════════════════════════════ -->
    <rect x="300" y="80" width="120" height="460" rx="10" fill="#FFF8E1" stroke="#F39C12" stroke-width="1.5"/>
    <text x="360" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#7E5109">MessageBusService</text>
    <text x="360" y="114" text-anchor="middle" font-size="9" fill="#9C640C">Subject&lt;ApplicationEvent&gt;</text>
    <text x="360" y="180" text-anchor="middle" font-size="9" fill="#9C640C">single observable</text>
    <text x="360" y="194" text-anchor="middle" font-size="9" fill="#9C640C">stream</text>
    <text x="360" y="404" text-anchor="middle" font-size="9" fill="#9C640C">MessageReactor</text>
    <text x="360" y="418" text-anchor="middle" font-size="9" fill="#9C640C">filter() per listener</text>

    <!-- ═══════════════════════════════════════════════════════════
         LEFT column — producers / signal readers
         ═══════════════════════════════════════════════════════════ -->

    <!-- Component (initiator) -->
    <rect x="40" y="120" width="240" height="44" rx="6" fill="#D6EAF8" stroke="#3498DB" stroke-width="1.5"/>
    <text x="160" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">Component</text>
    <text x="160" y="154" text-anchor="middle" font-size="9" fill="#2E86C1">user gesture (toolbar / context menu)</text>

    <!-- ① Component → Bus -->
    <line x1="280" y1="142" x2="296" y2="142" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="288" y="135" text-anchor="middle" font-size="10" fill="#37474F">① fires *Initiated</text>

    <!-- Dialog -->
    <rect x="40" y="200" width="240" height="44" rx="6" fill="#D6EAF8" stroke="#3498DB" stroke-width="1.5"/>
    <text x="160" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">Dialog (@if-mounted)
    </text>
    <text x="160" y="234" text-anchor="middle" font-size="9" fill="#2E86C1">user confirms · fires *Confirmed</text>

    <!-- ② Dialog → Bus -->
    <line x1="280" y1="222" x2="296" y2="222" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="288" y="215" text-anchor="middle" font-size="10" fill="#37474F">② fires *Confirmed</text>

    <!-- Component (re-render) -->
    <rect x="40" y="510" width="240" height="44" rx="6" fill="#D6EAF8" stroke="#3498DB" stroke-width="1.5"/>
    <text x="160" y="530" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">Component</text>
    <text x="160" y="544" text-anchor="middle" font-size="9" fill="#2E86C1">computed signal() · re-renders</text>

    <!-- ⑦ Bus → Component re-render -->
    <line x1="296" y1="532" x2="284" y2="532" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="288" y="498" text-anchor="middle" font-size="10" fill="#37474F">⑦ signal() reads</text>

    <!-- ═══════════════════════════════════════════════════════════
         RIGHT column — consumers / backend
         ═══════════════════════════════════════════════════════════ -->

    <!-- Command Listener (tall box, multi-step) -->
    <rect x="440" y="290" width="240" height="80" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
    <text x="560" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">Command Listener</text>
    <text x="560" y="328" text-anchor="middle" font-size="9" fill="#1E8449">③ receives *Confirmed (filter match)</text>
    <text x="560" y="342" text-anchor="middle" font-size="9" fill="#1E8449">④ FileService.method() → POST /api/…</text>
    <text x="560" y="356" text-anchor="middle" font-size="9" fill="#1E8449">⑤ emits *Succeeded / *Failed</text>

    <!-- ③ Bus → Cmd Listener -->
    <line x1="424" y1="312" x2="436" y2="312" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- ⑤ Cmd Listener → Bus -->
    <line x1="436" y1="356" x2="424" y2="356" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Outcome listeners (fan-out) -->
    <rect x="440" y="410" width="240" height="44" rx="6" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
    <text x="560" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">Outcome Listeners</text>
    <text x="560" y="444" text-anchor="middle" font-size="9" fill="#1E8449">Refresh · Notification · Progress</text>

    <!-- ⑥ Bus → Outcome listeners -->
    <line x1="424" y1="432" x2="436" y2="432" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="430" y="404" font-size="10" fill="#37474F">⑥ fan-out</text>

    <!-- ═══════════════════════════════════════════════════════════
         Footer note (CQRS)
         ═══════════════════════════════════════════════════════════ -->
    <rect x="30" y="558" width="660" height="32" rx="6" fill="none" stroke="#90A4AE" stroke-width="1"
          stroke-dasharray="6 4"/>
    <text x="44" y="574" font-size="9" fill="#546E7A" font-style="italic">CQRS split — only commands and outcomes flow
        through the bus.
    </text>
    <text x="44" y="586" font-size="9" fill="#546E7A" font-style="italic">Reads bypass it: components inject FileService
        and call it directly in ngOnInit / computed.
    </text>
</svg>
