<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470"
     font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12">
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 1.5 L8.5 5 L0 8.5 z" fill="#546E7A"/>
        </marker>
    </defs>

    <rect width="660" height="470" fill="#FAFAFA"/>

    <!-- Title -->
    <text x="330" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#212121">Download pipeline</text>

    <!-- Box 1: PostgreSQL Large Object (DATABASE) -->
    <rect x="50" y="36" width="560" height="40" rx="6" fill="#E8DAEF" stroke="#7D3C98" stroke-width="1.5"/>
    <text x="330" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#512E5F">PostgreSQL Large Object
        (OID)
    </text>
    <text x="330" y="69" text-anchor="middle" font-size="9" fill="#7D3C98">referenced by FileNode.content_oid</text>

    <!-- Arrow 1→2 -->
    <line x1="330" y1="76" x2="330" y2="100" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="338" y="92" font-size="9" fill="#546E7A">JTA transaction open · JDBC driver streams ciphertext</text>

    <!-- Box 2: java.sql.Blob (SERVER) -->
    <rect x="50" y="102" width="560" height="40" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="330" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">java.sql.Blob</text>
    <text x="330" y="135" text-anchor="middle" font-size="9" fill="#A04000">lazy-fetched · never materialised in memory
    </text>

    <!-- Arrow 2→3 -->
    <line x1="330" y1="142" x2="330" y2="166" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- Box 3: OutgoingBlob (DECRYPTION boundary) -->
    <rect x="50" y="168" width="560" height="40" rx="6" fill="#FADBD8" stroke="#CB4335" stroke-width="1.5"/>
    <text x="330" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#922B21">OutgoingBlob
        (decryption boundary)
    </text>
    <text x="330" y="201" text-anchor="middle" font-size="9" fill="#922B21">reads first 16 bytes as IV ·
        CipherInputStream (AES/CTR/NoPadding) over remainder
    </text>

    <!-- Arrow 3→4 -->
    <line x1="330" y1="208" x2="330" y2="232" stroke="#546E7A" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="338" y="224" font-size="9" fill="#546E7A">decrypted plaintext piped through StreamingOutput</text>

    <!-- Box 4: StreamingOutput (SERVER) -->
    <rect x="50" y="234" width="560" height="40" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5"/>
    <text x="330" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#784212">StreamingOutput (JAX-RS)
    </text>
    <text x="330" y="267" text-anchor="middle" font-size="9" fill="#A04000">wired by FileDownloadViewMessageBodyWriter ·
        JTA transaction stays open for the duration
    </text>

    <!-- HTTP boundary divider -->
    <line x1="20" y1="298" x2="640" y2="298" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="330" y="294" text-anchor="middle" font-size="9" fill="#90A4AE">— HTTPS response body · Content-Disposition:
        attachment; filename=… · original Content-Type —
    </text>

    <!-- Box 5: Browser anchor (CLIENT) -->
    <rect x="50" y="306" width="560" height="40" rx="6" fill="#D6EAF8" stroke="#2980B9" stroke-width="1.5"/>
    <text x="330" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">Browser anchor click →
        file saved to disk
    </text>
    <text x="330" y="339" text-anchor="middle" font-size="9" fill="#2980B9">Angular HttpClient · reportProgress: true ·
        observe: 'events'
    </text>

    <!-- Footer note -->
    <rect x="20" y="360" width="620" height="48" rx="8" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1"
          stroke-dasharray="5 3"/>
    <text x="330" y="378" text-anchor="middle" font-size="10" font-weight="700" fill="#7D6608">Client-side progress
    </text>
    <text x="330" y="393" text-anchor="middle" font-size="9" fill="#7D6608">HttpEventType.DownloadProgress →
        OperationProgressApplicationEventListener → ProgressNotification updates
    </text>
    <text x="330" y="404" text-anchor="middle" font-size="9" fill="#7D6608">rendered in NotificationCenter's download
        section
    </text>
</svg>
