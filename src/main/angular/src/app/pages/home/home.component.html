@if (userAccountView()) {
  <app-toolbar (signOutClicked)="onSignOut()" [userAccountView]="userAccountView()!"/>
  <div class="home">
    <h1>{{ 'home.title' | translate }}</h1>
    <p>{{
        'home.welcome' | translate:{
          firstName: userAccountView()!.firstName,
          lastName: userAccountView()!.lastName
        }
      }}</p>
  </div>
}
