<app-toolbar
  (signOutClicked)="onSignOut()"
  [userAccountView]="userAccountView()"/>
<app-breadcrumb
  (navigated)="onNavigateToDirectory($event)"
  [breadcrumbViews]="directoryContentsView()?.breadcrumbViews"
  [loading]="loading()"/>
<app-file-browser
  (folderOpened)="onNavigateToDirectory($event)"
  [fileNodeViews]="directoryContentsView()?.childrenFileNodeViews"
  [loading]="loading()"/>
