# =============================================================================
# Oppshan Files application.properties
# =============================================================================
# -------------------------------------------------------
# Google OIDC
# -------------------------------------------------------
quarkus.oidc.google.provider=google
quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.google.credentials.secret=${GOOGLE_CLIENT_SECRET}
quarkus.oidc.google.authentication.scopes=openid,email,profile
quarkus.oidc.google.authentication.error-path=/sign-in
quarkus.oidc.google.authentication.redirect-path=/api/auth/callback/google
quarkus.oidc.token-state-manager.encryption-secret=${TOKEN_ENCRYPTION_SECRET}
quarkus.oidc.application-type=web-app
%test.quarkus.oidc.google.tenant-enabled=false
%test.quarkus.oidc.auth-server-url=${keycloak.url}
%test.quarkus.oidc.client-id=quarkus-app
%test.quarkus.oidc.credentials.secret=secret
%test.quarkus.oidc.token-state-manager.encryption-secret=secret

# -------------------------------------------------------
# Datasource
# -------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=oppshan-files
%test.quarkus.datasource.password=oppshan-files oppshan-files
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:${quarkus.application.name};CIPHER=AES;AUTO_RECONNECT=TRUE;ACCESS_MODE_DATA=rws;TIME ZONE=UTC;

# -------------------------------------------------------
# Flyway
# -------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/postgresql
%test.quarkus.flyway.migrate-at-start=false

# -------------------------------------------------------
# Hibernate ORM
# -------------------------------------------------------
# Flyway owns the schema Hibernate only validates at startup
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.fetch.batch-size=25
quarkus.hibernate-orm.jdbc.statement-batch-size=25
quarkus.hibernate-orm.jdbc.statement-fetch-size=25
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.highlight-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.queries-slower-than-ms=1000
quarkus.hibernate-orm.log.jdbc-warnings=true
quarkus.hibernate-orm.second-level-caching-enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# -------------------------------------------------------
# Application
# -------------------------------------------------------
app.storage.max-bytes=1000000
app.storage.encryption-cipher=AES/CTR/NoPadding
app.storage.encryption-passphrase=${APP_STORAGE_ENCRYPTION_PASSPHRASE}
app.storage.encryption-kdf-iterations=600000
app.storage.encryption-kdf-key-length=256
app.storage.encryption-kdf-salt=oppshan-files
app.storage.encryption-iv-length=16
%test.app.storage.encryption-passphrase=secret

# -------------------------------------------------------
# Misc
# -------------------------------------------------------
quarkus.jacoco.report=true
quarkus.test.profile=test

%dev.quarkus.log.min-level=TRACE
