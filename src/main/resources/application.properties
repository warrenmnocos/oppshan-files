# =============================================================================
# Oppshan Files application.properties
# =============================================================================
# -------------------------------------------------------
# HTTP
# -------------------------------------------------------
quarkus.http.port=8080
quarkus.http.http2=false
quarkus.http.limits.max-body-size=1G
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=127.0.0.1

# Generous timeouts while profiling: the instrumented native binary is 2-3x
# slower per request, and the PGO workload puts 10 concurrent users through
# 100 MB uploads/downloads. Prod's 30s idle timeout times out long streaming
# requests under that contention; bumping to 5 minutes prevents server-side
# disconnects during profile capture.
%pgo.quarkus.http.idle-timeout=PT5M
%pgo.quarkus.http.read-timeout=PT5M

# -------------------------------------------------------
# Google OIDC
# -------------------------------------------------------
quarkus.oidc.google.provider=google
quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.google.credentials.secret=${GOOGLE_CLIENT_SECRET}
quarkus.oidc.google.authentication.scopes=openid,email,profile
quarkus.oidc.google.authentication.error-path=/sso/sign-in/oidc?message=messages.errors.signInFailed
quarkus.oidc.google.authentication.redirect-path=/sso/sign-in/oidc/callback/google
quarkus.oidc.google.authentication.extra-params.access_type=offline
quarkus.oidc.google.authentication.extra-params.prompt=consent
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.session-age-extension=5M
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token-state-manager.encryption-secret=${TOKEN_ENCRYPTION_SECRET}

%test.quarkus.oidc.google.provider=
%test.quarkus.oidc.google.auth-server-url=${keycloak.url}/realms/quarkus
%test.quarkus.oidc.google.client-id=quarkus-app
%test.quarkus.oidc.google.credentials.secret=secret
%test.quarkus.oidc.google.discovery=true
%test.quarkus.oidc.google.application-type=web-app
%test.quarkus.oidc.google.authentication.scopes=profile,email
%test.quarkus.oidc.token-state-manager.encryption-secret=secret
%test.quarkus.keycloak.devservices.enabled=true
%test.quarkus.keycloak.devservices.realm-path=keycloak/quarkus-realm.json

%dev.quarkus.keycloak.devservices.enabled=false

%pgo.quarkus.oidc.google.provider=
%pgo.quarkus.oidc.google.client-id=oppshan-pgo
%pgo.quarkus.oidc.google.credentials.secret=${PGO_OIDC_CLIENT_SECRET}
%pgo.quarkus.oidc.google.discovery=true
%pgo.quarkus.oidc.google.application-type=web-app
%pgo.quarkus.oidc.google.authentication.scopes=openid,email,profile
%pgo.quarkus.oidc.token-state-manager.encryption-secret=${TOKEN_ENCRYPTION_SECRET}

# -------------------------------------------------------
# Datasource
# -------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=18
quarkus.datasource.jdbc.min-size=12
quarkus.datasource.jdbc.max-size=12

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18
%test.quarkus.datasource.devservices.reuse=false

# -------------------------------------------------------
# Flyway
# -------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/postgresql

# -------------------------------------------------------
# Hibernate ORM
# -------------------------------------------------------
# Flyway owns the schema Hibernate only validates at startup
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.fetch.batch-size=25
quarkus.hibernate-orm.jdbc.statement-batch-size=25
quarkus.hibernate-orm.jdbc.statement-fetch-size=25
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.highlight-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.queries-slower-than-ms=1000
quarkus.hibernate-orm.log.jdbc-warnings=true
quarkus.hibernate-orm.request-scoped.enabled=false
quarkus.hibernate-orm.second-level-caching-enabled=false

%test.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.sql=true

# -------------------------------------------------------
# Application
# -------------------------------------------------------
app.storage.user-max-bytes=209715200
app.storage.total-max-bytes=16106127360
app.storage.file-upload-max-bytes=104857600
app.storage.encryption-cipher-algorithm=AES/CTR/NoPadding
app.storage.encryption-passphrase=${APP_STORAGE_ENCRYPTION_PASSPHRASE}
app.storage.encryption-kdf-iterations=1000000
app.storage.encryption-kdf-key-length=256
app.storage.encryption-kdf-salt=oppshan-files
app.storage.encryption-iv-length=16

%test.app.storage.encryption-passphrase=test-passphrase-for-integration-tests

# -------------------------------------------------------
# Misc
# -------------------------------------------------------
quarkus.package.jar.type=uber-jar
quarkus.test.profile=test
quarkus.log.console.darken=1
quarkus.banner.path=banner.txt

%dev.quarkus.log.min-level=TRACE
%test.quarkus.jacoco.report=true
